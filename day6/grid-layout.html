<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .parent {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(5, 1fr);
        gap: 8px;
        height: 250px;
        width: 700px;
      }

      .box{
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .div1 {
        grid-row: span 3 / span 3;
        background-color: aqua;
      }

      .div2 {
        grid-column: span 2 / span 2;
        background-color: aqua;
      }

      .div3 {
        grid-column-start: 4;
        background-color: brown;
      }

      .div4 {
        grid-column-start: 2;
        grid-row-start: 2;
        background-color: aqua;
      }

      .div5 {
        grid-column-start: 3;
        grid-row-start: 2;
        background-color: brown;
      }

      .div6 {
        grid-row: span 2 / span 2;
        grid-column-start: 4;
        grid-row-start: 2;
        background-color: aqua;
      }

      .div7 {
        grid-column-start: 2;
        grid-row-start: 3;
        background-color: brown;
      }

      .div8 {
        grid-column-start: 3;
        grid-row-start: 3;
        background-color: aqua;

      }
    </style>
  </head>
  <body>
    <div class="parent">
      <div class="div1 box">1</div>
      <div class="div2 box">2</div>
      <div class="div3 box">3</div>
      <div class="div4 box">4</div>
      <div class="div5 box">5</div>
      <div class="div6 box">6</div>
      <div class="div7 box">7</div>
      <div class="div8 box">8</div>
    </div>
  </body>
</html>
