<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
      }
      .box {
        height: 150px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
      }
      .box1 {
        background-color: rgb(123, 123, 230);
      }
      .box2 {
        background-color: rgb(230, 123, 132);
      }
      .box3 {
        background-color: rgb(123, 228, 230);
      }
      .box4 {
        background-color: rgb(128, 230, 123);
      }
      .box5 {
        background-color: rgb(230, 123, 230);
      }
      .box6 {
        background-color: rgb(230, 221, 123);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box box1">1</div>
      <div class="box box2">2</div>
      <div class="box box3">3</div>
      <div class="box box4">4</div>
      <div class="box box5">5</div>
      <div class="box box6">6</div>
    </div>
  </body>
</html>
