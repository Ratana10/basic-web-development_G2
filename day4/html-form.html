<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2px;
    }

    .name-row{
      display: flex;
      gap: 10px;
    }
    .name{
      flex: 1
    }

    label{
      font-size: 18px;
    }
    input[type="text"]{
      display: inline-block;
      width: 100%;
      padding:  6px 0;
      margin: 8px 0;
    }
    .agree{
      display: flex;
      text-align: left;
    }

    .agree a{
      text-decoration: none;
      color: black;
    }

    .btn-register{
      background-color: green;
      color: white;
      width: 100%;
      padding: 14px 0;
      border: none;
      margin-top: 20px;
      cursor: pointer;
    }

    .btn-register:hover{
      opacity: 80%;
    }

    .already-account{
      margin-top: 20px;
      text-align: center;
      
    }

    .already-account a{
      text-decoration: none;
      color: black;
      cursor: default;
    }

    .already-account span{
      color: green;
      cursor: pointer;
    }

    .img-container{
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .img{
      width: 200px;
      height: 200px;
    }
  </style>
</head>

<body>

  <form action="">
    <div class="img-container">
      <img class="img" src="https://cdn-icons-png.flaticon.com/512/147/147133.png" alt="Avatar Logo">
    </div>
   
    <div class="name-row">
      <div>
        <label for="">First Name</label>
        <input type="text" name="" id="" placeholder="Enter first name">
      </div>

      <div >
        <label for="">Last Name</label>
        <input type="text" name="" id="" placeholder="Enter last name">
      </div>
    </div>


    <div>
      <label for="">Username</label>
      <input type="text" name="" id="">
    </div>

    <div>
      <label for="">Password</label>
      <input type="text" name="" id="">
    </div>

    <div>
      <label for="">Confirm Password</label>
      <input type="text" name="" id="">
    </div>

    <div class="agree">
      <input type="checkbox" name="" id="">
      <a href="">I agree to the term and condition</a>
    </div>

    <button class="btn-register">Register</button>

    <div class="already-account">
      <a href="">Already have an account? <span>Login</span></a>
    </div>


  </form>

</body>

</html>
